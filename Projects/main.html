<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: rgb(22, 22, 28);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            width: 100%;
            height: 50px;
            background-color: rgb(12, 12, 15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            border-bottom: 1px solid rgb(40, 40, 50);
        }

        #header h2 {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        #settingsBtn {
            background: none;
            border: none;
            color: rgb(180, 180, 200);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            padding: 6px 12px;
            border-radius: 6px;
        }

        #settingsBtn:hover {
            transform: scale(1.05);
            color: white;
            background-color: rgb(40, 40, 50);
        }

        #settingsBtn:active {
            transform: scale(1.1);
        }

        #backBtn {
            background: none;
            border: 1px solid rgb(80, 80, 100);
            color: rgb(180, 180, 200);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        #backBtn:hover {
            transform: scale(1.05);
            background-color: rgb(40, 40, 50);
            color: white;
        }

        #backBtn:active {
            transform: scale(1.1);
        }

        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 250px;
            background-color: rgb(18, 18, 24);
            border-right: 1px solid rgb(40, 40, 50);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        #sidebarHeader {
            padding: 15px;
            border-bottom: 1px solid rgb(40, 40, 50);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #sidebarHeader h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: rgb(140, 140, 160);
            letter-spacing: 1px;
        }

        #newFileBtn, #newFolderBtn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #newFileBtn:hover, #newFolderBtn:hover {
            transform: scale(1.20);
        }

        #fileTree {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .file-item, .folder-item {
            padding: 5px 15px 5px 25px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.1s;
        }

        .file-item:hover, .folder-item:hover {
            background-color: rgb(35, 35, 48);
        }

        .file-item.active {
            background-color: rgb(40, 40, 55);
        }

        .folder-contents {
            display: none;
        }

        .folder-contents.open {
            display: block;
        }

        .folder-contents .file-item {
            padding-left: 45px;
        }

        .icon {
            font-size: 12px;
        }

        .delete-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: rgb(150, 150, 150);
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .file-item:hover .delete-btn, .folder-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: red;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #tabs {
            display: flex;
            background-color: rgb(18, 18, 24);
            border-bottom: 1px solid rgb(40, 40, 50);
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            border-right: 1px solid rgb(40, 40, 50);
            white-space: nowrap;
            transition: background-color 0.1s;
            color: rgb(140, 140, 160);
        }

        .tab:hover {
            background-color: rgb(30, 30, 42);
            color: white;
        }

        .tab.active {
            background-color: rgb(22, 22, 28);
            border-bottom: 2px solid rgb(0, 140, 255);
            color: white;
        }

        #editorArea {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #editorWrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #lineNumbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 45px;
            height: 100%;
            background-color: rgb(18, 18, 24);
            border-right: 1px solid rgb(40, 40, 50);
            padding: 15px 5px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: rgb(100, 100, 100);
            text-align: right;
            overflow: hidden;
            user-select: none;
            z-index: 3;
        }

        #highlightOverlay {
            position: absolute;
            top: 0;
            left: 45px;
            right: 0;
            bottom: 0;
            margin: 0;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            color: white;
            background-color: rgb(22, 22, 28);
            z-index: 1;
            pointer-events: none;
        }

        #codeArea {
            position: absolute;
            top: 0;
            left: 45px;
            right: 0;
            bottom: 0;
            width: calc(100% - 45px);
            height: 100%;
            background: transparent;
            color: transparent;
            caret-color: white;
            border: none;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            z-index: 2;
        }

        #preview {
            flex: 1;
            background-color: white;
            border-left: 1px solid rgb(50, 50, 50);
        }

        #terminal {
            height: 150px;
            background-color: rgb(12, 12, 16);
            border-top: 1px solid rgb(40, 40, 50);
            padding: 10px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: rgb(0, 255, 0);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .terminal-line {
            margin-bottom: 3px;
        }

        .terminal-error {
            color: rgb(255, 80, 80);
        }

        .terminal-warn {
            color: rgb(255, 200, 0);
        }

        .terminal-info {
            color: rgb(0, 150, 255);
        }

        #createModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #createModalContent {
            background-color: rgb(28, 28, 38);
            padding: 28px;
            border-radius: 10px;
            border: 1px solid rgb(50, 50, 65);
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 300px;
        }

        #createModalContent h3 {
            margin: 0;
            font-size: 18px;
        }

        #createModalContent input {
            padding: 10px 12px;
            background-color: rgb(18, 18, 24);
            color: white;
            border: 1px solid rgb(55, 55, 70);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #createModalContent input:focus {
            border-color: rgb(0, 140, 255);
        }

        #createModalContent .btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        #createModalContent button {
            padding: 8px 20px;
            background-color: rgb(0, 140, 255);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        #createModalContent button:hover {
            background-color: rgb(0, 120, 230);
        }

        #createModalContent .cancel-btn {
            background-color: rgb(80, 80, 80);
        }

        #createModalContent .cancel-btn:hover {
            background-color: rgb(100, 100, 100);
        }

        #settingsPanel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 200;
        }

        #settingsPanel h2 {
            color: white;
            margin: 0;
        }

        #settingsPanel button {
            padding: 10px 30px;
            background-color: rgb(0, 120, 212);
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #settingsPanel button:hover {
            background-color: rgb(0, 100, 190);
        }

        .kw { color: rgb(56, 164, 234); }
        .str { color: rgb(204, 120, 50); }
        .num { color: rgb(181, 137, 0); }
        .cmt { color: rgb(87, 166, 74); font-style: italic; }
        .tag { color: rgb(204, 120, 50); }
        .attr { color: rgb(181, 137, 0); }
        .val { color: rgb(204, 120, 50); }
        .fn { color: rgb(220, 220, 170); }
        .op { color: rgb(147, 132, 203); }
        .punc { color: rgb(170, 170, 170); }
        .bool { color: rgb(56, 164, 234); }
        .type { color: rgb(0, 188, 212); }
        .dec { color: rgb(204, 120, 50); }
        .param { color: rgb(220, 220, 170); }
        .prop { color: rgb(86, 182, 194); }
    </style>
</head>
<body>
    <header id="header">
        <button id="backBtn" onclick="window.location.href='../index.html'">&#8592; Back</button>
        <h2>Projects</h2>
        <button id="settingsBtn" onclick="document.getElementById('settingsPanel').style.display='flex'">Settings</button>
    </header>

    <div id="workspace">
        <div id="sidebar">
            <div id="sidebarHeader">
                <h3>Explorer</h3>
                <div>
                    <button id="newFolderBtn" title="New Folder">&#128193;</button>
                    <button id="newFileBtn" title="New File">&#128196;</button>
                </div>
            </div>
            <div id="fileTree"></div>
        </div>

        <div id="main">
            <div id="tabs"></div>
            <div id="editorArea">
                <div id="editorWrapper">
                    <div id="lineNumbers">1</div>
                    <pre id="highlightOverlay"></pre>
                    <textarea id="codeArea" spellcheck="false" placeholder="Select or create a file to start coding..."></textarea>
                </div>
                <iframe id="preview"></iframe>
            </div>
            <div id="terminal"></div>
        </div>
    </div>

    <div id="createModal">
        <div id="createModalContent">
            <h3 id="modalTitle">New File</h3>
            <input type="text" id="itemName" placeholder="Enter name...">
            <div class="btn-row">
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
                <button id="confirmBtn">Create</button>
            </div>
        </div>
    </div>

    <div id="settingsPanel">
        <h2>Settings</h2>
        <button onclick="document.getElementById('settingsPanel').style.display='none'">Close</button>
    </div>

    <script>
        let files = {};
        let folders = {};
        let openFiles = [];
        let currentFile = null;
        let createType = "file";
        let createParent = null;

        const codeArea = document.getElementById("codeArea");
        const highlightOverlay = document.getElementById("highlightOverlay");
        const lineNumbers = document.getElementById("lineNumbers");

        function terminalLog(msg, type) {
            const terminal = document.getElementById("terminal");
            const line = document.createElement("div");
            line.className = "terminal-line" + (type ? " terminal-" + type : "");
            line.textContent = "> " + msg;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function highlightCode(code, fileName) {
            let escaped = escapeHtml(code);
            const ext = fileName ? fileName.split(".").pop().toLowerCase() : "";

            if (ext === "html" || ext === "htm") {
                escaped = escaped
                    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="cmt">$1</span>')
                    .replace(/(&lt;\/?)([\w-]+)/g, '$1<span class="tag">$2</span>')
                    .replace(/\b([\w-]+)(=)/g, '<span class="attr">$1</span>$2')
                    .replace(/(".*?")/g, '<span class="val">$1</span>')
                    .replace(/('.*?')/g, '<span class="val">$1</span>');
            } else if (ext === "js" || ext === "javascript") {
                escaped = escaped
                    .replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>')
                    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>')
                    .replace(/\b(var|let|const|function|return|if|else|for|while|do|switch|case|break|continue|new|this|class|extends|import|export|from|default|try|catch|finally|throw|async|await|yield|typeof|instanceof|in|of)\b/g, '<span class="kw">$1</span>')
                    .replace(/\b(true|false|null|undefined|NaN|Infinity)\b/g, '<span class="bool">$1</span>')
                    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>')
                    .replace(/(".*?")/g, '<span class="str">$1</span>')
                    .replace(/('.*?')/g, '<span class="str">$1</span>')
                    .replace(/(`.*?`)/g, '<span class="str">$1</span>')
                    .replace(/\b([a-zA-Z_$][\w$]*)\s*\(/g, '<span class="fn">$1</span>(');
            } else if (ext === "css") {
                escaped = escaped
                    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>')
                    .replace(/([.#]?[\w-]+)\s*\{/g, '<span class="tag">$1</span> {')
                    .replace(/([\w-]+)\s*:/g, '<span class="attr">$1</span>:')
                    .replace(/:\s*([^;{}]+)/g, ': <span class="val">$1</span>')
                    .replace(/(\d+\.?\d*(px|em|rem|%|vh|vw|s|ms)?)\b/g, '<span class="num">$1</span>');
            } else if (ext === "py") {
                escaped = escaped
                    .replace(/(#.*$)/gm, '<span class="cmt">$1</span>')
                    .replace(/\b(def|class|return|if|elif|else|for|while|import|from|as|try|except|finally|raise|with|lambda|yield|global|nonlocal|pass|break|continue|and|or|not|in|is)\b/g, '<span class="kw">$1</span>')
                    .replace(/\b(True|False|None)\b/g, '<span class="bool">$1</span>')
                    .replace(/\b(print|len|range|int|str|float|list|dict|tuple|set|input|open|self)\b/g, '<span class="fn">$1</span>')
                    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>')
                    .replace(/(".*?")/g, '<span class="str">$1</span>')
                    .replace(/('.*?')/g, '<span class="str">$1</span>');
            } else if (ext === "cs") {
                escaped = escaped
                    .replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>')
                    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>')
                    .replace(/\b(var|int|float|double|string|bool|void|class|struct|enum|interface|public|private|protected|static|readonly|new|this|null|true|false|if|else|for|while|do|switch|case|break|continue|return|try|catch|finally|throw|using|namespace|async|await|yield|override|virtual|abstract|sealed|partial|const)\b/g, '<span class="kw">$1</span>')
                    .replace(/\b(Console|String|Math|List|Dictionary|int|bool|string|object)\b/g, '<span class="type">$1</span>')
                    .replace(/\b(\d+\.?\d*[f]?)\b/g, '<span class="num">$1</span>')
                    .replace(/(".*?")/g, '<span class="str">$1</span>');
            } else if (ext === "cpp" || ext === "c" || ext === "h") {
                escaped = escaped
                    .replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>')
                    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cmt">$1</span>')
                    .replace(/\b(#include|#define|#ifdef|#ifndef|#endif|#pragma)\b/g, '<span class="dec">$1</span>')
                    .replace(/\b(int|float|double|char|bool|void|string|auto|const|static|extern|register|volatile|unsigned|signed|long|short|struct|class|enum|typedef|namespace|template|typename|virtual|override|public|private|protected|new|delete|nullptr|this|true|false|if|else|for|while|do|switch|case|break|continue|return|try|catch|throw|using|inline|constexpr)\b/g, '<span class="kw">$1</span>')
                    .replace(/\b(cout|cin|endl|std|vector|map|set|pair|queue|stack|list|deque|algorithm|iostream|string)\b/g, '<span class="type">$1</span>')
                    .replace(/\b(\d+\.?\d*[f]?)\b/g, '<span class="num">$1</span>')
                    .replace(/(".*?")/g, '<span class="str">$1</span>')
                    .replace(/('.*?')/g, '<span class="str">$1</span>');
            } else {
                escaped = escaped
                    .replace(/(\/\/.*$)/gm, '<span class="cmt">$1</span>')
                    .replace(/\b(function|var|let|const|return|if|else|for|while|class|new|this|import|export|from|default|try|catch|finally|throw|async|await|true|false|null|undefined)\b/g, '<span class="kw">$1</span>')
                    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>')
                    .replace(/(".*?")/g, '<span class="str">$1</span>')
                    .replace(/('.*?')/g, '<span class="str">$1</span>');
            }

            return escaped;
        }

        function updateHighlight() {
            const code = codeArea.value;
            const fileName = currentFile || "";
            highlightOverlay.innerHTML = highlightCode(code, fileName) + "\n";
        }

        function updateLineNumbers() {
            const lines = codeArea.value.split("\n").length;
            let nums = "";
            for (let i = 1; i <= lines; i++) {
                nums += i + "\n";
            }
            lineNumbers.textContent = nums;
        }

        function syncScroll() {
            highlightOverlay.scrollTop = codeArea.scrollTop;
            highlightOverlay.scrollLeft = codeArea.scrollLeft;
            lineNumbers.scrollTop = codeArea.scrollTop;
        }

        const bracketPairs = { "{": "}", "[": "]", "(": ")", '"': '"', "'": "'" };

        codeArea.addEventListener("input", () => {
            updateHighlight();
            updateLineNumbers();
            syncScroll();
        });

        codeArea.addEventListener("scroll", syncScroll);

        codeArea.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                const start = codeArea.selectionStart;
                const end = codeArea.selectionEnd;
                codeArea.value = codeArea.value.substring(0, start) + "    " + codeArea.value.substring(end);
                codeArea.selectionStart = codeArea.selectionEnd = start + 4;
                updateHighlight();
                updateLineNumbers();
                return;
            }

            if (bracketPairs[e.key]) {
                e.preventDefault();
                const start = codeArea.selectionStart;
                const end = codeArea.selectionEnd;
                const selected = codeArea.value.substring(start, end);
                const close = bracketPairs[e.key];
                const before = codeArea.value.substring(0, start);
                const after = codeArea.value.substring(end);
                codeArea.value = before + e.key + selected + close + after;
                if (selected) {
                    codeArea.selectionStart = start + 1;
                    codeArea.selectionEnd = start + 1 + selected.length;
                } else {
                    codeArea.selectionStart = codeArea.selectionEnd = start + 1;
                }
                updateHighlight();
                updateLineNumbers();
                return;
            }

            if (e.key === "Backspace") {
                const start = codeArea.selectionStart;
                if (start > 0 && start === codeArea.selectionEnd) {
                    const charBefore = codeArea.value[start - 1];
                    const charAfter = codeArea.value[start];
                    if (bracketPairs[charBefore] === charAfter) {
                        e.preventDefault();
                        codeArea.value = codeArea.value.substring(0, start - 1) + codeArea.value.substring(start + 1);
                        codeArea.selectionStart = codeArea.selectionEnd = start - 1;
                        updateHighlight();
                        updateLineNumbers();
                        return;
                    }
                }
            }

            if (e.key === "Enter") {
                e.preventDefault();
                const start = codeArea.selectionStart;
                const before = codeArea.value.substring(0, start);
                const after = codeArea.value.substring(codeArea.selectionEnd);
                const lastLine = before.split("\n").pop();
                const indent = lastLine.match(/^(\s*)/)[1];
                codeArea.value = before + "\n" + indent + after;
                codeArea.selectionStart = codeArea.selectionEnd = start + 1 + indent.length;
                updateHighlight();
                updateLineNumbers();
            }
        });

        function renderFileTree() {
            const tree = document.getElementById("fileTree");
            tree.innerHTML = "";

            for (const name in folders) {
                const folder = document.createElement("div");
                const folderHeader = document.createElement("div");
                folderHeader.className = "folder-item";
                folderHeader.innerHTML = '<span class="icon">&#128193;</span> ' + name +
                    '<button class="delete-btn" data-folder="' + name + '">&#10005;</button>';

                folderHeader.querySelector(".delete-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    for (const f in files) {
                        if (files[f].folder === name) {
                            openFiles = openFiles.filter(of => of !== f);
                            if (currentFile === f) currentFile = null;
                            delete files[f];
                        }
                    }
                    delete folders[name];
                    renderFileTree();
                    renderTabs();
                    terminalLog("Deleted folder: " + name);
                });

                folderHeader.addEventListener("click", () => {
                    const contents = folder.querySelector(".folder-contents");
                    contents.classList.toggle("open");
                });

                const contents = document.createElement("div");
                contents.className = "folder-contents";

                for (const fileName in files) {
                    if (files[fileName].folder === name) {
                        const fileEl = document.createElement("div");
                        fileEl.className = "file-item" + (currentFile === fileName ? " active" : "");
                        fileEl.innerHTML = '<span class="icon">&#128196;</span> ' + fileName +
                            '<button class="delete-btn" data-file="' + fileName + '">&#10005;</button>';

                        fileEl.addEventListener("click", (e) => {
                            if (e.target.classList.contains("delete-btn")) return;
                            openFile(fileName);
                        });

                        fileEl.querySelector(".delete-btn").addEventListener("click", (e) => {
                            e.stopPropagation();
                            delete files[fileName];
                            openFiles = openFiles.filter(f => f !== fileName);
                            if (currentFile === fileName) currentFile = null;
                            renderTabs();
                            renderFileTree();
                            terminalLog("Deleted file: " + fileName);
                        });

                        contents.appendChild(fileEl);
                    }
                }

                folder.appendChild(folderHeader);
                folder.appendChild(contents);
                tree.appendChild(folder);
            }

            for (const name in files) {
                if (files[name].folder) continue;
                const fileEl = document.createElement("div");
                fileEl.className = "file-item" + (currentFile === name ? " active" : "");
                fileEl.innerHTML = '<span class="icon">&#128196;</span> ' + name +
                    '<button class="delete-btn" data-file="' + name + '">&#10005;</button>';

                fileEl.addEventListener("click", (e) => {
                    if (e.target.classList.contains("delete-btn")) return;
                    openFile(name);
                });

                fileEl.querySelector(".delete-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    delete files[name];
                    openFiles = openFiles.filter(f => f !== name);
                    if (currentFile === name) currentFile = null;
                    renderTabs();
                    renderFileTree();
                    terminalLog("Deleted file: " + name);
                });

                tree.appendChild(fileEl);
            }
        }

        function renderTabs() {
            const tabs = document.getElementById("tabs");
            tabs.innerHTML = "";
            openFiles.forEach(name => {
                const tab = document.createElement("div");
                tab.className = "tab" + (currentFile === name ? " active" : "");
                tab.textContent = name;
                tab.addEventListener("click", () => openFile(name));
                tabs.appendChild(tab);
            });
        }

        function openFile(name) {
            if (currentFile) {
                files[currentFile].content = codeArea.value;
            }
            currentFile = name;
            if (!openFiles.includes(name)) openFiles.push(name);
            codeArea.value = files[name].content;
            updateHighlight();
            updateLineNumbers();
            renderTabs();
            renderFileTree();
            terminalLog("Opened: " + name);
        }

        function showCreateModal(type, parent) {
            createType = type;
            createParent = parent || null;
            document.getElementById("modalTitle").textContent = type === "file" ? "New File" : "New Folder";
            document.getElementById("itemName").value = "";
            document.getElementById("createModal").style.display = "flex";
            document.getElementById("itemName").focus();
        }

        document.getElementById("newFileBtn").addEventListener("click", () => showCreateModal("file"));
        document.getElementById("newFolderBtn").addEventListener("click", () => showCreateModal("folder"));

        document.getElementById("cancelBtn").addEventListener("click", () => {
            document.getElementById("createModal").style.display = "none";
        });

        document.getElementById("confirmBtn").addEventListener("click", () => {
            const name = document.getElementById("itemName").value.trim();
            if (!name) {
                terminalLog("Error: Name cannot be empty", "error");
                return;
            }
            if (createType === "file") {
                if (files[name]) {
                    terminalLog("Error: File already exists", "error");
                    return;
                }
                files[name] = { content: "", folder: createParent };
                terminalLog("Created file: " + name, "info");
                openFile(name);
            } else {
                if (folders[name]) {
                    terminalLog("Error: Folder already exists", "error");
                    return;
                }
                folders[name] = true;
                terminalLog("Created folder: " + name, "info");
            }
            document.getElementById("createModal").style.display = "none";
            renderFileTree();
        });

        document.getElementById("itemName").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("confirmBtn").click();
        });

        setInterval(() => {
            if (currentFile && currentFile.endsWith(".html")) {
                const code = codeArea.value;
                const preview = document.getElementById("preview");
                const doc = preview.contentDocument || preview.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            }
        }, 2000);

        terminalLog("Workspace ready. Create a file or folder to begin.", "info");
    </script>
</body>
</html>
