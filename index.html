<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Start/style.css">
    <title>The Experience Of Coding</title>
</head>
<body>
    <header id="header" style="display: none;">
        <button id="settingsBtn" onclick="GETI('settingsPanel').style.display='flex'">Settings</button>
    </header>
    <img id="logo" class="abs" src="Logo.png" alt="Logo">
    <h1 id="title" class="abs">The Experience Of Coding</h1>

    <div id="authSection" class="form-section">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <p id="warning"></p>
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
    </div>

    <div id="btns" style="display: none;">
        <button id="learnFund" class="abs" onclick="moveHtml('Fundamentals/main.html')">Learn the Fundamentals</button>
        <button id="otherSW" class="abs">VS Code (Web)</button>
        <button id="projects" class="abs" onclick="moveHtml('Projects/main.html')">Projects</button>
        <button id="learnLang" class="abs" onclick="moveHtml('LLang/main.html')">Learn a Language</button>
        <button id="coursesBtn" class="abs">Courses</button>
        <button id="codeShare" class="abs" onclick="moveHtml('Code-share/main.html')">Code Share</button>
    </div>

    <div id="settingsPanel" style="display: none;">
        <h2>Settings</h2>
        <button id="darkMode">Dark Mode</button>
        <button id="lightMode">Light Mode</button>
        <p id="settingsWarning"></p>
        <button id="logoutBtn">Log Out</button>
        <button id="deleteBtn">Delete Account</button>
        <button id="closeSettings" onclick="GETI('settingsPanel').style.display='none'">Close</button>
    </div>

    <script src="Start/main.js"></script>
    <footer style="text-align:center; padding:10px; font-size:14px;">Made By Josef Dawson Biler</footer>
</body>
</html>
