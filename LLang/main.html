<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn a Language</title>
    <link rel="stylesheet" href="../Start/shared.css">
    <style>
        body { padding: 20px; }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        .lang-btn {
            background-color: rgb(30, 30, 40);
            color: white;
            font-weight: 600;
            font-size: 16px;
            border: 1px solid rgb(60, 60, 80);
            border-radius: 10px;
            padding: 28px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            transform: scale(1.05);
            background-color: rgb(45, 45, 60);
            border-color: rgb(80, 80, 100);
        }

        .lang-btn:active {
            transform: scale(1.1);
            background-color: rgb(55, 55, 70);
        }

        .diff-btns {
            display: flex;
            gap: 24px;
            margin-top: 10px;
        }

        .diff-btn {
            background-color: rgb(30, 30, 40);
            color: white;
            font-weight: 600;
            font-size: 18px;
            border: 1px solid rgb(60, 60, 80);
            border-radius: 10px;
            padding: 22px 36px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn:hover {
            transform: scale(1.05);
            background-color: rgb(45, 45, 60);
            border-color: rgb(80, 80, 100);
        }

        .diff-btn:active {
            transform: scale(1.1);
            background-color: rgb(55, 55, 70);
        }
    </style>
</head>
<body>
    <div id="header">
        <button class="backBtn" onclick="goBack()">&#8592; Back</button>
        <h2>Learn a Language</h2>
        <button id="settingsBtn" onclick="GETI('settingsPanel').style.display='flex'">Settings</button>
    </div>

    <div id="settingsPanel">
        <h2>Settings</h2>
        <button onclick="toggleDarkMode()">Dark Mode</button>
        <button onclick="toggleLightMode()">Light Mode</button>
        <button onclick="GETI('settingsPanel').style.display='none'">Close</button>
    </div>

    <div class="content" id="pageLang">
        <div class="main-title">Pick a Language!</div>
        <div class="lang-grid">
            <button class="lang-btn" onclick="pickLang('js')">JavaScript</button>
            <button class="lang-btn" onclick="pickLang('py')">Python</button>
            <button class="lang-btn" onclick="pickLang('html')">HTML</button>
            <button class="lang-btn" onclick="pickLang('css')">CSS</button>
            <button class="lang-btn" onclick="pickLang('cpp')">C++</button>
            <button class="lang-btn" onclick="pickLang('java')">Java</button>
        </div>
    </div>

    <div class="content hidden" id="pageDiff">
        <div class="main-title" id="diffTitle">Choose Difficulty</div>
        <div class="diff-btns">
            <button class="diff-btn" onclick="pickDiff('beginner')">Beginner</button>
            <button class="diff-btn" onclick="pickDiff('advanced')">Advanced</button>
        </div>
    </div>

    <div class="content hidden" id="pageLesson">
        <div class="lesson-title" id="lessonTitle"></div>
        <div class="lesson" id="lessonContent"></div>
        <div class="lesson-nav">
            <button class="nav-btn" id="prevLesson" onclick="changeLesson(-1)">Previous</button>
            <button class="nav-btn" id="nextLesson" onclick="changeLesson(1)">Next</button>
        </div>
    </div>

    <script>
        function GETI(id) { return document.getElementById(id); }

        function toggleDarkMode() {
            document.body.style.backgroundColor = "rgb(30, 30, 30)";
            document.body.style.color = "white";
        }

        function toggleLightMode() {
            document.body.style.backgroundColor = "rgb(240, 240, 240)";
            document.body.style.color = "black";
        }

        let currentLang = "";
        let currentDiff = "";
        let currentLessonIdx = 0;

        function goBack() {
            if (!GETI("pageLesson").classList.contains("hidden")) {
                GETI("pageLesson").classList.add("hidden");
                GETI("pageDiff").classList.remove("hidden");
                return;
            }
            if (!GETI("pageDiff").classList.contains("hidden")) {
                GETI("pageDiff").classList.add("hidden");
                GETI("pageLang").classList.remove("hidden");
                return;
            }
            window.location.href = "../index.html";
        }

        function pickLang(lang) {
            currentLang = lang;
            const names = {
                js: "JavaScript", py: "Python", html: "HTML",
                css: "CSS", cpp: "C++", java: "Java"
            };
            GETI("diffTitle").textContent = "Choose Difficulty — " + names[lang];
            GETI("pageLang").classList.add("hidden");
            GETI("pageDiff").classList.remove("hidden");
        }

        function pickDiff(diff) {
            currentDiff = diff;
            currentLessonIdx = 0;
            renderLesson();
            GETI("pageDiff").classList.add("hidden");
            GETI("pageLesson").classList.remove("hidden");
        }

        function changeLesson(dir) {
            const lessons = lessonsData[currentLang][currentDiff];
            currentLessonIdx += dir;
            if (currentLessonIdx < 0) currentLessonIdx = 0;
            if (currentLessonIdx >= lessons.length) currentLessonIdx = lessons.length - 1;
            renderLesson();
        }

        function renderLesson() {
            const lessons = lessonsData[currentLang][currentDiff];
            const lesson = lessons[currentLessonIdx];
            const names = {
                js: "JavaScript", py: "Python", html: "HTML",
                css: "CSS", cpp: "C++", java: "Java"
            };
            GETI("lessonTitle").textContent =
                names[currentLang] + " — " +
                (currentDiff === "beginner" ? "Beginner" : "Advanced") +
                " (Lesson " + (currentLessonIdx + 1) + " of " + lessons.length + ")";
            GETI("lessonContent").innerHTML = lesson;
            GETI("prevLesson").style.visibility = currentLessonIdx === 0 ? "hidden" : "visible";
            GETI("nextLesson").style.visibility = currentLessonIdx === lessons.length - 1 ? "hidden" : "visible";
        }

        const lessonsData = {
            js: {

let greeting = first + " " + second;
